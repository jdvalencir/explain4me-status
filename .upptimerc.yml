owner: jdvalencir
repo: explain4me-status

# Every 5 minutes (Upptime's default). Each URL must answer 2xx.
sites:
  - name: Dashboard
    url: https://explain4me.com
  - name: API
    url: https://api.explain4me.com/api/health
  - name: TikTok metrics
    url: https://api.explain4me.com/api/health/tiktok
  - name: Instagram metrics
    url: https://api.explain4me.com/api/health/instagram
  - name: Facebook metrics
    url: https://api.explain4me.com/api/health/facebook
  - name: X metrics
    url: https://api.explain4me.com/api/health/x
  - name: YouTube metrics
    url: https://api.explain4me.com/api/health/youtube

assignees:
  - jdvalencir

status-website:
  # DNS: CNAME status -> jdvalencir.github.io
  cname: status.explain4me.com
  logoUrl: https://explain4me.com/logo/e4me-logo-mark.png
  name: Explain4me Status
  introTitle: "**Explain4me** status"
  introMessage: "Availability of the dashboard, the API and metric updates per platform. A platform shows as down when it hasn't updated metrics in over 12 hours.<br><br>*Español:* disponibilidad del dashboard, la API y la actualización de métricas por plataforma. Una plataforma aparece caída si no actualiza métricas hace más de 12 horas."
  navbar:
    - title: Status
      href: /
    - title: Explain4me
      href: https://explain4me.com

