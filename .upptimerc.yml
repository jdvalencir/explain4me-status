owner: jdvalencir
repo: explain4me-status

# Every 5 minutes (Upptime's default). Each URL must answer 2xx.
sites:
  - name: Dashboard
    url: https://explain4me.com
  - name: API
    url: https://api.explain4me.com/api/health
  - name: Métricas de TikTok
    url: https://api.explain4me.com/api/health/tiktok
  - name: Métricas de Instagram
    url: https://api.explain4me.com/api/health/instagram
  - name: Métricas de Facebook
    url: https://api.explain4me.com/api/health/facebook
  - name: Métricas de X
    url: https://api.explain4me.com/api/health/x
  - name: Métricas de YouTube
    url: https://api.explain4me.com/api/health/youtube

assignees:
  - jdvalencir

status-website:
  # Until status.explain4me.com points here (CNAME), the page lives at
  # https://jdvalencir.github.io/explain4me-status. Swap baseUrl for
  # `cname: status.explain4me.com` once the DNS record exists.
  baseUrl: /explain4me-status
  logoUrl: https://explain4me.com/logo/e4me-logo-mark.png
  name: Explain4me Status
  introTitle: "Estado de **Explain4me**"
  introMessage: "Disponibilidad del dashboard, la API y la actualización de métricas por plataforma. Una plataforma aparece caída si no actualiza métricas hace más de 12 horas."
  navbar:
    - title: Estado
      href: /
    - title: Explain4me
      href: https://explain4me.com
